name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each check is its own job, so a PR shows which one failed. pnpm verify
  # runs the same commands in one go on a laptop.
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm codegen
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm codegen
      - run: pnpm lint

  tokens:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm tokens:check
      - run: pnpm test:tokens

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - run: pnpm codegen
      - run: pnpm test:hooks
      - run: pnpm checks
      - run: pnpm check:agents-md
      - run: pnpm check:ci

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - run: pnpm codegen
      - run: pnpm test

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm codegen
      - run: pnpm build-storybook

  # Agents work in git worktrees, so the checks must pass in a fresh one.
  worktree:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - run: pnpm check:worktree

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check the title is a Conventional Commits header
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [a-z].*[^.]$'
          if ! [[ "$TITLE" =~ $re ]] || [ ${#TITLE} -gt 72 ]; then
            echo "::error::The PR title becomes the squash commit header. Use 'type(scope): description', lowercase, imperative, at most 72 characters, no final period."
            exit 1
          fi

  baselines:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require Erik's label for changed baseline images
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD | grep -E '(__screenshots__/|-snapshots/)' || true)
          if [ -n "$changed" ] && ! echo "$LABELS" | grep -q '"baselines-approved"'; then
            echo "::error::This PR changes baseline images. Erik must add the baselines-approved label."
            echo "$changed"
            exit 1
          fi
