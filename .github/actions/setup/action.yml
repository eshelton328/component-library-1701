name: setup
description: Install pnpm, Node 24 and the locked dependencies, and optionally Chromium.
inputs:
  browser:
    description: Install Chromium for the Storybook story tests.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # Chromium and the system packages it needs. The apt mirror is
    # sometimes slow (32 MB in 5 min 36 s in library run 44423292766), so
    # the browser and the .deb files apt fetched are cached per OS, runner
    # architecture and Playwright version. On a hit the .deb files go back
    # into apt's archive folder before the usual install: apt uses a saved
    # file only when its version and hash match the index, and downloads
    # the rest, so a newer runner image still gets its own packages.
    - if: inputs.browser == 'true'
      id: playwright
      shell: bash
      run: echo "key=playwright-${ImageOS}-${RUNNER_ARCH}-$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - if: inputs.browser == 'true'
      id: playwright-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/playwright-debs
        key: ${{ steps.playwright.outputs.key }}
    - if: inputs.browser == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: sudo cp ~/.cache/playwright-debs/*.deb /var/cache/apt/archives/
    # apt waits with no limit for an index that stops mid-transfer: a
    # test-stories setup hung in apt-get update for 6 h (the-bridge run
    # 45161813669). Give each fetch 30 s with no data and three tries, so
    # a stalled mirror fails or moves on in minutes.
    - if: inputs.browser == 'true'
      shell: bash
      run: |
        printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "3";' \
          | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
    # The runner image also lists packages.microsoft.com, which gave 403 and
    # an unsigned InRelease on 2026-11-27, and apt-get update in the install
    # below stopped the job (NCC-150, the-bridge NCC-148). Chromium's
    # packages come only from the Ubuntu archive, and the runner is thrown
    # away after the job, so move those source files out and print them.
    - if: inputs.browser == 'true'
      shell: bash
      run: |
        mapfile -t sources < <(grep -l 'packages\.microsoft\.com' /etc/apt/sources.list.d/* 2>/dev/null || true)
        if [ "${#sources[@]}" -eq 0 ]; then echo "No apt source names packages.microsoft.com."; exit 0; fi
        sudo mkdir -p /etc/apt/sources.list.d.off
        for source in "${sources[@]}"; do
          sudo mv "$source" /etc/apt/sources.list.d.off/
          echo "Moved $source to /etc/apt/sources.list.d.off/"
        done
    - if: inputs.browser == 'true'
      id: playwright-install
      shell: bash
      env:
        HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
      run: |
        pnpm exec playwright install --with-deps chromium
        if [ "$HIT" != true ]; then
          mkdir -p ~/.cache/playwright-debs
          cp /var/cache/apt/archives/*.deb ~/.cache/playwright-debs/ 2>/dev/null || true
          if compgen -G "$HOME/.cache/playwright-debs/*.deb" > /dev/null; then echo "save=true" >> "$GITHUB_OUTPUT"; fi
        fi
    - if: steps.playwright-install.outputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/playwright-debs
        key: ${{ steps.playwright.outputs.key }}
