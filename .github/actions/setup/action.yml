name: setup
description: Install pnpm, Node 24 and the locked dependencies, and optionally Chromium.
inputs:
  browser:
    description: Install Chromium for the Storybook story tests.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.browser == 'true'
      run: pnpm exec playwright install --with-deps chromium
      shell: bash
