name: pr

# The PR checks that read the PR itself, not the code: its title and its
# labels. They run on every event that can change either, so ci.yml does
# not need to rerun the code checks on an edit or a label. The job names
# are the required checks in the protect-main ruleset; keep them.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

# A newer event on the same PR carries the newest title and labels, so it
# replaces an older run.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the title is a Conventional Commits header
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [a-z].*[^.]$'
          if ! [[ "$TITLE" =~ $re ]] || [ ${#TITLE} -gt 72 ]; then
            echo "::error::The PR title becomes the squash commit header. Use 'type(scope): description', lowercase, imperative, at most 72 characters, no final period."
            exit 1
          fi

  baselines:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require Erik's label for changed baseline images
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD | grep -E '(__screenshots__/|-snapshots/)' || true)
          if [ -n "$changed" ] && ! echo "$LABELS" | grep -q '"baselines-approved"'; then
            echo "::error::This PR changes baseline images. Erik must add the baselines-approved label."
            echo "$changed"
            exit 1
          fi
