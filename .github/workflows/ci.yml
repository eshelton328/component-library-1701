name: ci

on:
  # Only a change to the code runs these checks. A title edit or a label
  # runs pr.yml (pr-title, baselines) instead: on 2026-11-15 to 18, edits
  # and labels on a commit that had already run here cost about 2,000
  # minutes and cancelled runs in progress (ci-actions-audit in the brain).
  pull_request:
    types: [opened, synchronize, reopened]
  # release.yml calls this workflow on each push to main and beta, so the
  # release runs only after these checks pass on the same commit.
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. The group names the
# event and the PR number, because an edit of a closed PR runs with the
# base branch's ref, and with `ci-${{ github.ref }}` it cancelled the
# checks of a release run on main (2026-11-15). A push run, called by
# release.yml, gets a group of its own run ID, so no other run can cancel
# it or replace it while it waits. A commit sha is not enough: the same
# commit pushed to main and beta would share a group.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each check is its own job, so a PR shows which one failed. pnpm verify
  # runs the same commands in one go on a laptop. typecheck, lint, tokens,
  # checks and test wait for the worktree job: when it ran pnpm verify on
  # this commit, they use its result instead of running the same commands
  # again (bridge-coord cleared it on 2026-11-19 with these conditions:
  # scripts/ci-reuse.test.ts proves verify runs each job's commands, a
  # skipped verify runs the jobs in full, and any other end fails them).
  typecheck:
    needs: worktree
    # Runs after any end of the worktree job, except a cancelled run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      # pnpm verify in the worktree job runs this job's commands
      # (scripts/ci-reuse.test.ts checks it). When that job ran verify on
      # this commit and passed, this job uses its result; when it skipped
      # verify (a PR that changes only src/, api/ or Markdown), this job
      # runs in full. Any other end of the worktree job fails this job.
      - name: Use the worktree result when it ran pnpm verify
        id: reuse
        env:
          RESULT: ${{ needs.worktree.result }}
          RAN: ${{ needs.worktree.outputs.ran }}
        run: |
          set -euo pipefail
          if [ "$RESULT" != success ]; then
            echo "::error::The worktree job ended with '$RESULT', so this check fails; see the worktree job."
            exit 1
          fi
          if [ "$RAN" = true ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The worktree job ran pnpm verify on this commit, which runs this job's commands, and it passed."
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.reuse.outputs.reuse != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.reuse.outputs.reuse != 'true'
        uses: ./.github/actions/setup
      - if: steps.reuse.outputs.reuse != 'true'
        run: pnpm codegen
      - if: steps.reuse.outputs.reuse != 'true'
        run: pnpm typecheck

  lint:
    needs: worktree
    # Runs after any end of the worktree job, except a cancelled run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      # pnpm verify in the worktree job runs this job's commands
      # (scripts/ci-reuse.test.ts checks it). When that job ran verify on
      # this commit and passed, this job uses its result; when it skipped
      # verify (a PR that changes only src/, api/ or Markdown), this job
      # runs in full. Any other end of the worktree job fails this job.
      - name: Use the worktree result when it ran pnpm verify
        id: reuse
        env:
          RESULT: ${{ needs.worktree.result }}
          RAN: ${{ needs.worktree.outputs.ran }}
        run: |
          set -euo pipefail
          if [ "$RESULT" != success ]; then
            echo "::error::The worktree job ended with '$RESULT', so this check fails; see the worktree job."
            exit 1
          fi
          if [ "$RAN" = true ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The worktree job ran pnpm verify on this commit, which runs this job's commands, and it passed."
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.reuse.outputs.reuse != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.reuse.outputs.reuse != 'true'
        uses: ./.github/actions/setup
      - if: steps.reuse.outputs.reuse != 'true'
        run: pnpm codegen
      - if: steps.reuse.outputs.reuse != 'true'
        run: pnpm lint

  tokens:
    needs: worktree
    # Runs after any end of the worktree job, except a cancelled run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      # pnpm verify in the worktree job runs this job's commands
      # (scripts/ci-reuse.test.ts checks it). When that job ran verify on
      # this commit and passed, this job uses its result; when it skipped
      # verify (a PR that changes only src/, api/ or Markdown), this job
      # runs in full. Any other end of the worktree job fails this job.
      - name: Use the worktree result when it ran pnpm verify
        id: reuse
        env:
          RESULT: ${{ needs.worktree.result }}
          RAN: ${{ needs.worktree.outputs.ran }}
        run: |
          set -euo pipefail
          if [ "$RESULT" != success ]; then
            echo "::error::The worktree job ended with '$RESULT', so this check fails; see the worktree job."
            exit 1
          fi
          if [ "$RAN" = true ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The worktree job ran pnpm verify on this commit, which runs this job's commands, and it passed."
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.reuse.outputs.reuse != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.reuse.outputs.reuse != 'true'
        uses: ./.github/actions/setup
      - if: steps.reuse.outputs.reuse != 'true'
        run: pnpm tokens:check
      - if: steps.reuse.outputs.reuse != 'true'
        run: pnpm test:tokens
      - if: steps.reuse.outputs.reuse != 'true'
        run: pnpm test:figma

  checks:
    needs: worktree
    # Runs after any end of the worktree job, except a cancelled run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      # pnpm verify in the worktree job runs this job's commands
      # (scripts/ci-reuse.test.ts checks it). When that job ran verify on
      # this commit and passed, this job uses its result; when it skipped
      # verify (a PR that changes only src/, api/ or Markdown), this job
      # runs in full. Any other end of the worktree job fails this job.
      - name: Use the worktree result when it ran pnpm verify
        id: reuse
        env:
          RESULT: ${{ needs.worktree.result }}
          RAN: ${{ needs.worktree.outputs.ran }}
        run: |
          set -euo pipefail
          if [ "$RESULT" != success ]; then
            echo "::error::The worktree job ended with '$RESULT', so this check fails; see the worktree job."
            exit 1
          fi
          if [ "$RAN" = true ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The worktree job ran pnpm verify on this commit, which runs this job's commands, and it passed."
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.reuse.outputs.reuse != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.reuse.outputs.reuse != 'true'
        uses: ./.github/actions/setup
        with:
          browser: 'true'
      - if: steps.reuse.outputs.reuse != 'true'
        run: pnpm codegen
      - if: steps.reuse.outputs.reuse != 'true'
        run: pnpm test:hooks
      - if: steps.reuse.outputs.reuse != 'true'
        run: pnpm checks
      - if: steps.reuse.outputs.reuse != 'true'
        run: pnpm test:cycles
      - if: steps.reuse.outputs.reuse != 'true'
        run: pnpm check:cycles
      - if: steps.reuse.outputs.reuse != 'true'
        run: pnpm check:agents-md
      - if: steps.reuse.outputs.reuse != 'true'
        run: pnpm check:ci

  test:
    needs: worktree
    # Runs after any end of the worktree job, except a cancelled run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      # pnpm verify in the worktree job runs this job's commands
      # (scripts/ci-reuse.test.ts checks it). When that job ran verify on
      # this commit and passed, this job uses its result; when it skipped
      # verify (a PR that changes only src/, api/ or Markdown), this job
      # runs in full. Any other end of the worktree job fails this job.
      - name: Use the worktree result when it ran pnpm verify
        id: reuse
        env:
          RESULT: ${{ needs.worktree.result }}
          RAN: ${{ needs.worktree.outputs.ran }}
        run: |
          set -euo pipefail
          if [ "$RESULT" != success ]; then
            echo "::error::The worktree job ended with '$RESULT', so this check fails; see the worktree job."
            exit 1
          fi
          if [ "$RAN" = true ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The worktree job ran pnpm verify on this commit, which runs this job's commands, and it passed."
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.reuse.outputs.reuse != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.reuse.outputs.reuse != 'true'
        uses: ./.github/actions/setup
        with:
          browser: 'true'
      - if: steps.reuse.outputs.reuse != 'true'
        run: pnpm codegen
      - if: steps.reuse.outputs.reuse != 'true'
        run: pnpm test

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm codegen
      - run: pnpm build-storybook

  # The public API report, the release script tests and the packed package.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm codegen
      - run: pnpm check:api
      - run: pnpm test:release
      - run: pnpm check:pack

  # Agents work in git worktrees, so the checks must pass in a fresh one.
  # On a PR that changes only files under src/ or api/, or Markdown files,
  # the job passes without running: a fresh worktree differs from the CI
  # checkout only in setup (install, config, scripts), and those files do
  # not change it (the owner approved, ci-actions-audit in the brain). A push run
  # (release.yml, before a release) always runs it, and nightly.yml runs it
  # on main every night.
  worktree:
    runs-on: ubuntu-24.04
    outputs:
      # true when this job ran pnpm check:worktree (pnpm verify).
      ran: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the change can affect a fresh worktree
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists both paths of a rename, so a file moved into src/
          # still counts where it came from. A failed diff stops the step (set
          # -e), so the job fails and never passes unchecked.
          changed=$(git diff --name-only --no-renames "$BASE" HEAD)
          other=$(printf '%s\n' "$changed" | grep -vE '^(src/|api/)|\.md$' || true)
          if [ -n "$other" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Files outside src/ and api/ changed, so check:worktree runs:"
            echo "$other"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Only src/, api/ or Markdown files changed, so check:worktree does not run on this PR; nightly.yml runs it on main."
          fi
      - if: steps.paths.outputs.run == 'true'
        uses: ./.github/actions/setup
        with:
          browser: 'true'
      - if: steps.paths.outputs.run == 'true'
        run: pnpm check:worktree

  # Secrets and private values in the commits of this PR (gitleaks 8.30.1,
  # rules in .gitleaks.toml). Personal values come from the secret
  # PRIVACY_TERMS, so they are never in the repository. The pre-commit hook
  # runs the same scan earlier, but a hook can be skipped; this job is the gate.
  secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      # The rule tests run gitleaks on planted lines; they need no packages.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test the scan rules
        env:
          GITLEAKS: ${{ runner.temp }}/gitleaks
        run: node --test scripts/secret-scan.test.ts
      - name: Scan the commits of this PR
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A missing secret would turn the personal check off, so it fails.
          if [ -z "$PRIVACY_TERMS" ]; then echo "::error::the secret PRIVACY_TERMS is missing"; exit 1; fi
          alt="$(printf '%s\n' "$PRIVACY_TERMS" | grep -v '^[[:space:]]*#' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' | sed 's/[][\\.*^$+?(){}|/]/\\&/g' | paste -sd '|' -)"
          cfg="$RUNNER_TEMP/gitleaks.toml"
          cat .gitleaks.toml > "$cfg"
          printf '\n[[rules]]\nid = "personal-term"\ndescription = "A value from the secret PRIVACY_TERMS"\n' >> "$cfg"
          printf "regex = '''(?i)\\\\b(?:%s)\\\\b'''\n" "$alt" >> "$cfg"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --ignore-gitleaks-allow --config "$cfg" --log-opts="--diff-merges=remerge $BASE..$HEAD" .
